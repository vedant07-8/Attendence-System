<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance History - SmartAttendance</title>
  <meta name="description" content="View personal session-by-session attendance logs with timestamps and status details.">

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app-wrapper" id="app-shell">
    <main class="app-content" id="main-content">
      
      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="filter-group">
          <select id="filter-subject" class="form-select" style="width: 240px;">
            <option value="">All Subjects</option>
          </select>
          <select id="filter-status" class="form-select" style="width: 160px;">
            <option value="">All Statuses</option>
            <option value="present">Present Only</option>
            <option value="absent">Absent Only</option>
          </select>
        </div>
      </div>

      <!-- History Table Card -->
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Lecture Date</th>
              <th>Subject Code</th>
              <th>Subject Title</th>
              <th>Marked By (Faculty)</th>
              <th style="width: 160px; text-align: center;">Status</th>
            </tr>
          </thead>
          <tbody id="student-history-tbody">
            <tr>
              <td colspan="5" class="table-loader">
                <div class="spinner"></div> Loading attendance history...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/student/history.js"></script>
</body>
</html>
