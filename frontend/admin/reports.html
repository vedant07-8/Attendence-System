<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Attendance Reports - SmartAttendance</title>
  <meta name="description" content="Generate and export comprehensive monthly student attendance reports.">

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app-wrapper" id="app-shell">
    <main class="app-content" id="main-content">
      
      <!-- Filter Bar -->
      <div class="card" style="margin-bottom: 24px;">
        <div class="card-header">
          <h2 class="card-title"><i data-lucide="filter"></i> Generate Monthly Report</h2>
          <button class="btn btn-secondary btn-sm" id="btn-print-report">
            <i data-lucide="printer"></i> Print / PDF
          </button>
        </div>
        <div class="card-body">
          <form id="report-filter-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="report-class" class="form-label">Select Class *</label>
              <select id="report-class" class="form-select" required>
                <option value="">Select Class</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
              <label for="report-subject" class="form-label">Subject (Optional)</label>
              <select id="report-subject" class="form-select">
                <option value="">All Subjects</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
              <label for="report-month" class="form-label">Month</label>
              <select id="report-month" class="form-select">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
              <label for="report-year" class="form-label">Year</label>
              <select id="report-year" class="form-select">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" style="height: 40px;">
              <i data-lucide="file-text"></i>
              <span>Generate</span>
            </button>
          </form>
        </div>
      </div>

      <!-- Report Header Summary Banner -->
      <div id="report-header-banner" style="display: none; margin-bottom: 20px;">
        <div class="card" style="background-color: var(--bg-subtle);">
          <div class="card-body" style="padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
            <div>
              <span id="banner-meta" style="font-weight: 700; font-size: var(--font-size-base); color: var(--text-primary);">-</span>
              <div id="banner-sub" style="font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px;">-</div>
            </div>
            <div style="display: flex; gap: 16px;">
              <div style="text-align: right;">
                <span style="font-size: var(--font-size-xs); color: var(--text-muted); text-transform: uppercase;">Class Average</span>
                <div id="banner-avg" style="font-size: var(--font-size-lg); font-weight: 700; color: var(--brand-accent);">-</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Report Results Table Card -->
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Roll Number</th>
              <th>Student Name</th>
              <th>Held in Month</th>
              <th>Attended</th>
              <th>Missed</th>
              <th>Monthly Attendance %</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="report-table-body">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 48px;">
                Select a class and click "Generate" to preview monthly attendance analytics.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/admin/reports.js"></script>
</body>
</html>
